[Service]
# The stock 1,024-message Foxglove queue can replay many seconds of stale
# camera/TF/scan data after a brief Wi-Fi or browser-rendering stall. Keep a
# short live-view queue instead; the bridge drops the oldest data-plane
# messages on overflow, so the viewer catches up to the robot's current state.
ExecStart=
ExecStart=/bin/bash -c 'source /etc/turtlebot4/setup.bash && exec ros2 launch foxglove_bridge foxglove_bridge_launch.xml port:=8765 message_backlog_size:=16'
