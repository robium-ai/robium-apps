<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Silly TurtleBot system flow</title>
  <desc id="desc">An operator sends a mission to a Gemini Robotics session. A deterministic guard validates semantic tools before an HTTP robot adapter calls ROS 2 and Nav2. Camera, state, and action results flow back to Gemini and to a Lichtblick browser view.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f4f6f8; }
      .box { fill: #ffffff; stroke: #bcc7d4; stroke-width: 2; }
      .model { fill: #e8f3ff; stroke: #4d8dca; }
      .guard { fill: #fff5dc; stroke: #c48b21; }
      .robot { fill: #e9f7ef; stroke: #459467; }
      .label { fill: #111827; font: 600 23px Inter, Arial, sans-serif; }
      .small { fill: #475569; font: 17px Inter, Arial, sans-serif; }
      .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #4d8dca; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="650"/>

  <rect class="box" x="55" y="85" width="230" height="120" rx="10"/>
  <text class="label" x="170" y="130" text-anchor="middle">Operator</text>
  <text class="small" x="170" y="165" text-anchor="middle">mission · stop · update</text>

  <rect class="box model" x="355" y="55" width="300" height="180" rx="10"/>
  <text class="label" x="505" y="105" text-anchor="middle">Gemini Robotics ER 2</text>
  <text class="small" x="505" y="143" text-anchor="middle">persistent Live API session</text>
  <text class="small" x="505" y="176" text-anchor="middle">text · JPEG · PCM</text>
  <text class="small" x="505" y="209" text-anchor="middle">semantic tool selection</text>

  <rect class="box guard" x="735" y="55" width="310" height="180" rx="10"/>
  <text class="label" x="890" y="105" text-anchor="middle">Mission guard</text>
  <text class="small" x="890" y="143" text-anchor="middle">allowlist · exact arguments</text>
  <text class="small" x="890" y="176" text-anchor="middle">ranges · state · cancellation</text>
  <text class="small" x="890" y="209" text-anchor="middle">blocking terminal results</text>

  <rect class="box" x="735" y="330" width="310" height="120" rx="10"/>
  <text class="label" x="890" y="375" text-anchor="middle">HTTP robot adapter</text>
  <text class="small" x="890" y="412" text-anchor="middle">narrow non-DDS boundary</text>

  <rect class="box robot" x="690" y="505" width="400" height="110" rx="10"/>
  <text class="label" x="890" y="548" text-anchor="middle">ROS 2 · Nav2 · Create 3</text>
  <text class="small" x="890" y="584" text-anchor="middle">motion · lidar · odometry · stop</text>

  <rect class="box" x="120" y="350" width="390" height="145" rx="10"/>
  <text class="label" x="315" y="395" text-anchor="middle">Lichtblick workspace</text>
  <text class="small" x="315" y="432" text-anchor="middle">3D map · plans · camera</text>
  <text class="small" x="315" y="465" text-anchor="middle">mission events · manual controls</text>

  <path class="flow" d="M285 145 H345"/>
  <path class="flow" d="M655 145 H725"/>
  <path class="flow" d="M890 235 V320"/>
  <path class="flow" d="M890 450 V495"/>
  <path class="feedback" d="M680 560 H590 Q555 560 555 525 V285 Q555 250 520 250 H505 V235"/>
  <path class="feedback" d="M690 590 H565 Q530 590 530 555 V515 Q530 485 500 485 H520"/>

  <text class="small" x="610" y="325">tool result + fresh state</text>
  <text class="small" x="535" y="535">camera · TF · plans · logs</text>
</svg>
