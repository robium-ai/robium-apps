[project]
name = "silly-turtlebot"
version = "0.2.0"
description = "A guarded proactive Gemini Robotics ER 2 navigation agent for TurtleBot 4"
readme = "README.md"
authors = [{ name = "robium", email = "admin@robium.ai" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "google-genai>=2.22.0,<3",
]

[project.scripts]
silly-turtlebot = "silly_turtlebot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
