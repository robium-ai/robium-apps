schema_version: "1"
id: stackchan-er2
name: STACK-CHAN ER 2 Companion
summary: Talk through an M5Stack STACK-CHAN while Gemini Robotics ER 2 speaks, performs named head animations, shows text, and looks on demand.
version: 0.4.0
status: experimental
license: MIT
tags: [stackchan, m5stack, esp32-s3, gemini-robotics, voice, vision, real-robot]

runtime:
  kind: uv
  entrypoint: ./app run

verbs:
  help:
    command: ./app help
    summary: Show setup and run commands
  build:
    command: ./app build
    summary: Prepare the locked Python environment
  doctor:
    command: ./app doctor
    summary: Check the Mac, API key, and connected STACK-CHAN
  run:
    command: ./app run
    summary: Start a continuous-listening Gemini Robotics ER 2 conversation
  smoke:
    command: ./app smoke
    summary: Run lint, unit tests, and the hardware-free demo

modes:
  demo:
    command: ./app demo
    summary: Run the deterministic hardware-free action path
  device:
    command: ./app device-doctor
    summary: Query the connected companion firmware
  hardware:
    command: ./app hardware-smoke
    summary: Check the real display, head, microphone, speaker, and camera
  camera:
    command: ./app camera
    summary: Save one local camera frame without sending it to Gemini

requirements:
  hardware: [M5Stack STACK-CHAN K151 connected over USB]
  gpu: none
  network: required

demo:
  default_mode: run
  hosted: false
  estimated_startup_seconds: 8

artifacts:
  architecture_brief: docs/architecture-brief.md
