[project]
name = "vla-pick-and-place"
version = "0.2.0"
description = "Drive a simulated SO-101 arm and replay published demonstrations on the SO101-Nexus MuJoCo environment"
readme = "README.md"
authors = [{ name = "robium", email = "admin@robium.ai" }]
# LeRobot 0.6.0 hard-requires >=3.12.
requires-python = ">=3.12"
dependencies = [
    # `[dataset]`, not `[smolvla,training]`: nothing here loads or trains a
    # policy, and pulling a VLA stack for a page that runs no policy is a
    # large install and a false advertisement. `[dataset]` is the extra that
    # carries torchcodec — WITHOUT it every recorded episode fails to decode
    # and playback dies, so it is not optional despite the name. The training
    # guide adds the extra a real ACT run needs.
    "lerobot[dataset]==0.6.0",
    # THE environment. Pinned exactly, never a range: the app's whole contract
    # (observation components, action units, success predicate, camera names)
    # is this package's, and an unpinned minor bump can move any of them.
    # `so101_nexus[teleop]` is NOT usable here — that extra requires
    # lerobot<0.6 and would silently downgrade the pin above.
    "so101-nexus==0.5.1",
    # >=3.1.3 is so101-nexus's own floor; it caps at <4.
    "mujoco>=3.10.0,<4",
    "gymnasium>=1.0.0",
    # Pinned exactly: matches robium's rerun skill. Used for the OFFLINE
    # .rrd files `./app sim` / `./app play` write — the web page renders
    # frames directly (see docs/architecture-brief.md, "Rerun").
    "rerun-sdk==0.34.1",
    "numpy>=1.26",
    "gradio>=6.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
# `slow` is everything that reaches the network or boots the gateway: the
# dataset checks pull a pinned Hub revision, and the demo smoke starts a real
# subprocess. Both are real pass bars, not benchmarks — they are out of the
# default path so `make test` stays offline and fast, and they run via
# `make dataset-check` / `make demo-smoke`, or `make test-all`.
#
# Everything else (pins, env contract, worker threading, page copy and layout)
# stays in the default run and must not be skipped.
markers = [
    "slow: needs the Hub or a running gateway; run via `make demo-smoke` / `make test-all`",
]
addopts = "-m 'not slow'"
