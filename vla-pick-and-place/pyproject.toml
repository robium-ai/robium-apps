[project]
name = "vla-pick-and-place"
version = "0.2.0"
description = "Pi0.5 evaluation and optional live rollout for LIBERO-Goal task 8"
readme = "README.md"
authors = [{ name = "robium", email = "admin@robium.ai" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi==0.139.0",
    "gradio==5.49.1",
    "imageio==2.37.4",
    "imageio-ffmpeg==0.6.0",
    "jsonschema==4.26.0",
    "pillow==11.3.0",
    "uvicorn==0.51.0",
]

[project.optional-dependencies]
gpu = [
    "hf-libero==0.1.4",
    "lerobot[pi] @ git+https://github.com/huggingface/lerobot.git@8fff0fde7c79f23a93d845d1a50e985de01f8b8a",
]

[project.scripts]
vla-pick-and-place = "vla_pick_and_place.cli:main"
vla-pick-and-place-gateway = "vla_pick_and_place.gateway:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
addopts = "-q"
