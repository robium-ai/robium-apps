schema_version: "1"
id: vla-pick-and-place
name: Pi0.5 VLA pick and place
summary: Run the official Pi0.5 checkpoint on Franka Panda in LIBERO-Goal task 8.
version: 0.2.1
status: experimental
license: MIT
tags: [vla, pi05, lerobot, libero, franka, language]

runtime:
  kind: uv
  entrypoint: make run

verbs:
  build: make sync
  demo: make run
  smoke: make smoke
  check: make check
  test: make test

modes:
  fake:
    command: make run
    summary: Free deterministic fixture rollout through the protected Gradio gateway.
  feasibility:
    command: python -m vla_pick_and_place.cli feasibility --output /evidence
    summary: One paid 32 GB RTX PRO 4500 rollout; run only after the issue's paid preflight gate.

requirements:
  hardware: [NVIDIA RTX PRO 4500 Blackwell Server Edition 32GB, NVIDIA A40 48GB, NVIDIA RTX A6000 48GB]
  gpu: remote
  network: required

demo:
  default_mode: fake
  hosted: true
  orchestrator:
    provider: runpod
    demo_id: vla-pick-and-place
    title: Pi0.5 · LIBERO-Goal task 8
    local_image: robium/vla-pick-and-place:fake
    image: us-central1-docker.pkg.dev/robium-prod/robium/vla-pick-and-place@sha256:1301937ab020a8120b54aefd680f40ed4191857406e9cb1e73816bfaf1270f0c
    command: [/app/.venv/bin/python, -m, vla_pick_and_place.gateway]
    gateway_port: 8765
    ready_log: DEMO READY
    max_instances: 1
    session_seconds: 600
    boot_timeout_seconds: 480
    ready_seconds: 600
    absolute_lifetime_seconds: 1200
    gpu_allowlist: [NVIDIA RTX PRO 4500 Blackwell Server Edition, NVIDIA A40, NVIDIA RTX A6000]
    env:
      VLA_LIVE_ENABLED: false
      VLA_STARTUP_MODE: gateway
      VLA_RUNTIME_MODE: fake
      VLA_POLICY_EXECUTION: eager
      VLA_CHECKPOINT_PATH: /models/pi05-libero-v044
      VLA_STAGED_CHECKPOINT_PATH: /tmp/pi05-libero-v044
      VLA_DIAGNOSTIC_OUTPUT: /models/issue-69-live-diagnostics
      VLA_GATEWAY_PORT: 8765
      HF_HUB_OFFLINE: 1
      TRANSFORMERS_OFFLINE: 1
      MUJOCO_GL: egl
    runpod:
      template_id: e56b2xl1y1
      registry_auth_id: cmt6r3i1c004cq5uqoj4666yr
      data_center_ids: [US-KS-2]
      network_volume_id: 68s0bxbv7p
      volume_mount_path: /models
      max_hourly_rate_usd: 1.5
      daily_budget_usd: 5
  estimated_startup_seconds: 480

artifacts:
  architecture: docs/architecture-brief.md
  evidence_schema: evidence/manifest.schema.json
