schema_version: "1"
id: vla-pick-and-place
name: VLA pick and place (SO-101 on SO101-Nexus)
summary: Drive a simulated SO-101 arm joint by joint and replay published expert demonstrations of the same pick-and-place task, in the same pinned MuJoCo environment.
version: 0.2.0
status: experimental     # no trained controller matches this environment yet
license: MIT
tags: [mujoco, so-101, so101-nexus, lerobot, manipulation, teleoperation]

runtime:
  kind: uv
  entrypoint: make demo

verbs:
  build: make sync
  demo: make demo
  smoke: make demo-smoke
  check: make check
  test: make test

modes:
  contract:
    command: make contract
    summary: re-measure the pinned environment's schema and fail on drift
  dataset-check:
    command: make dataset-check
    summary: verify the pinned demonstrations match this environment, schema and scene
  controllers:
    command: make controllers
    summary: list controllers and the named reason each unavailable one cannot run
  sim:
    command: make sim
    summary: drive the simulator headless and write a Rerun .rrd
  play:
    command: make play
    summary: replay a pinned recorded episode headless and write a Rerun .rrd

requirements:
  hardware: []
  gpu: none              # nothing in this milestone runs a policy
  network: required      # first dataset playback pulls the pinned Hub revision

demo:
  default_mode: demo
  # The demo runs on the visitor's own machine (`./app run`), not on hosted
  # infrastructure.
  hosted: false
  # DORMANT: how `make demo-image`'s container is launched. Kept because the
  # container path is still a supported local option. Not consumed by
  # demo-orchestrator while `hosted: false`.
  orchestrator:
    demo_id: vla-pick-and-place
    title: SO-101 pick and place (SO101-Nexus + MuJoCo)
    image: vla-pick-and-place:latest
    command: [python, -m, vla_pick_and_place.demo.gateway]
    gateway_port: 8765
    ready_log: DEMO READY
    max_instances: 1
    session_seconds: 1800
  estimated_startup_seconds: 20

artifacts: {}
