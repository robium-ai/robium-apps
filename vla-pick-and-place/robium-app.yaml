schema_version: "1"
id: vla-pick-and-place
name: Pi0.5 VLA pick and place
summary: Run the official Pi0.5 checkpoint on Franka Panda in LIBERO-Goal task 8.
version: 0.2.0
status: experimental
license: MIT
tags: [vla, pi05, lerobot, libero, franka, language]

runtime:
  kind: uv
  entrypoint: make run

verbs:
  build: make sync
  demo: make run
  smoke: make smoke
  check: make check
  test: make test

modes:
  fake:
    command: make run
    summary: Free deterministic fixture rollout through the protected Gradio gateway.
  feasibility:
    command: python -m vla_pick_and_place.cli feasibility --output /evidence
    summary: One paid 48 GB CUDA rollout; run only after the issue's paid preflight gate.

requirements:
  hardware: [NVIDIA A100 SXM 80GB]
  gpu: remote
  network: required

demo:
  default_mode: fake
  hosted: true
  orchestrator:
    provider: runpod
    demo_id: vla-pick-and-place
    title: Pi0.5 · LIBERO-Goal task 8
    image: us-central1-docker.pkg.dev/robium-prod/robium/vla-pick-and-place@sha256:d0c53a7fb0ccc420fc8320dfd90653b60fc6eb3a75351dc297c85cb87528e927
    command: [python, -m, vla_pick_and_place.gateway]
    gateway_port: 8765
    ready_log: DEMO READY
    max_instances: 1
    boot_timeout_seconds: 480
    ready_seconds: 600
    absolute_lifetime_seconds: 1200
    gpu_allowlist: [NVIDIA A100-SXM4-80GB]
    network_volume_mount: /models
  estimated_startup_seconds: 480

artifacts:
  architecture: docs/architecture-brief.md
  evidence_schema: evidence/manifest.schema.json
