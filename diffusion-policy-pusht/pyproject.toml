[project]
name = "diffusion-policy-pusht"
version = "0.1.0"
description = "Diffusion Policy on PushT: train, benchmark checkpoints, and run replayable browser rollouts"
readme = "README.md"
authors = [
    { name = "robium", email = "admin@robium.ai" }
]
requires-python = ">=3.12"
dependencies = [
    # No `viz` extra: it pins rerun-sdk<0.34.0, which conflicts with
    # gradio_rerun 0.34.1 — the explicit rerun-sdk pin below replaces it
    # (same resolution vla-trial uses).
    "lerobot[diffusion,pusht,training]==0.6.0",
    # Direct pins let uv select CPU wheels on Linux while retaining native
    # PyPI/MPS wheels on macOS; otherwise LeRobot's transitive torch resolves
    # to CUDA-enabled Linux wheels in the shared lock.
    "torch==2.11.0",
    "torchvision==0.26.0",
    # Browser demo. rerun-sdk and gradio_rerun are pinned to
    # each other — the viewer component and SDK must match minor versions.
    "rerun-sdk==0.34.1",
    "gradio>=6.0.0",
    "gradio_rerun==0.34.1",
    "fastapi>=0.115",
    "imageio[ffmpeg]>=2.37",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=11.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["slow: loads real checkpoints / boots the gateway; run via make demo-smoke"]
addopts = "-m 'not slow'"

# Linux is the hosted CPU image; macOS falls back to PyPI's native MPS wheels.
# Pin both packages because torchvision must match the selected torch build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
