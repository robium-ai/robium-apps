schema_version: "1"
id: diffusion-policy-pusht
name: PushT with Diffusion Policy
summary: Run a published PushT Diffusion Policy on macOS, inspect honest evidence, and replay randomized layouts live.
version: 3.3.0
status: experimental
license: MIT
tags: [imitation-learning, lerobot, diffusion-policy, pusht, gradio, rerun, mps]

runtime:
  kind: uv
  entrypoint: ./app run

verbs:
  help:
    command: ./app help
    summary: Show commands and examples
  doctor:
    command: ./app doctor
    summary: Diagnose uv, ffmpeg, checkpoint, port, and optional Docker readiness
  build:
    command: ./app build
    summary: Prepare the uv environment and pinned official checkpoint
  run:
    command: ./app run
    summary: Run the native policy workspace with MPS when available
  status:
    command: ./app status
    summary: Show the policy process, local URL, and log path
  logs:
    command: ./app logs
    summary: Follow policy workspace logs
  stop:
    command: ./app stop
    summary: Stop the policy workspace

modes:
  prepare-official:
    command: make prepare-official
    summary: fetch the pinned official checkpoint and generate LeRobot 0.6 compatibility processors
  demo-smoke:
    command: make demo-smoke
    summary: boot to DEMO READY and complete T and OOD episodes through the Gradio API

requirements:
  hardware: []
  gpu: optional
  network: required

demo:
  default_mode: demo
  hosted: true
  estimated_startup_seconds: 45
  orchestrator:
    demo_id: diffusion-policy-pusht
    title: PushT with Diffusion Policy — LeRobot + Rerun
    image: diffusion-policy-pusht:latest
    command: [/app/.venv/bin/python, -m, diffusion_policy_pusht.demo.gateway]
    gateway_port: 8765
    ready_log: DEMO READY
    max_instances: 2
    session_seconds: 1800
    env:
      POLICY_DEVICE: cpu
      HF_HUB_OFFLINE: "1"

artifacts:
  thumbnail: assets/thumbnail.png
  case_study: docs/case-study.md
