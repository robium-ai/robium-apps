schema_version: "1"
id: vla-language-learning
name: VLA language learning (SmolVLA + SO-101)
summary: Language-conditioned pick-and-place with a SmolVLA policy driving a simulated SO-101 arm; pipeline proven end-to-end, full-training policy pending.
version: 0.1.0
status: experimental     # honest: no checkpoint trained long enough to succeed yet
license: MIT
tags: [vla, smolvla, lerobot, mujoco, so-101, language]

runtime:
  kind: uv
  entrypoint: make demo

verbs:
  build: make sync assets
  demo: make demo
  smoke: make smoke
  check: make check
  test: make test

scenarios:
  oracle:
    command: make oracle
    summary: scripted-IK canary, 10/10 on tuned seeds, proves scene/physics/success predicate
  viz-oracle:
    command: make viz-oracle
    summary: one oracle episode logged to a Rerun .rrd for eyeballing
  train-smoke:
    command: make train-smoke
    summary: free local config/shape gate before any paid remote training run

requirements:
  hardware: []
  gpu: remote            # HF Jobs GPU for training; local eval runs on MPS/CPU
  network: required      # Hub assets + HF Jobs

demo:
  default_scenario: demo
  hosted: true
  orchestrator:            # source for demo-orchestrator demos/<demo_id>.json
    demo_id: vla-trial     # legacy id kept by live-demo infra through the rename
    title: Language-conditioned VLA arm (SmolVLA + MuJoCo + Rerun)
    # matches what `make demo-image` builds post-rename; robium-website's
    # demos.json must adopt the same tag when it regenerates from this section
    image: vla-language-learning:latest
    command: [python, -m, vla_language_learning.demo.gateway]
    gateway_port: 8765
    ready_log: DEMO READY
    max_instances: 1
    session_seconds: 1800
  estimated_startup_seconds: 60

artifacts:
  thumbnail: null
  case_study: docs/case-study.md
