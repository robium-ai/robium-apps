<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">ACT ALOHA application flow</title>
  <desc id="desc">The browser starts a child rollout process. MuJoCo produces observations for ACT, ACT returns action chunks, and Rerun records the episode.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563EB"/></marker></defs>
  <rect width="1200" height="520" fill="#EDEFEE"/>
  <text x="64" y="70" fill="#2563EB" font-family="ui-monospace, monospace" font-size="18" letter-spacing="2">ACT ALOHA / SYSTEM FLOW</text>
  <g font-family="Inter, Arial, sans-serif" fill="#101719">
    <g transform="translate(64 150)"><rect width="190" height="120" fill="#E8ECEB" stroke="#ADBAB9"/><text x="24" y="50" font-size="24" font-weight="650">Browser</text><text x="24" y="82" font-size="16" fill="#3B494C">seed · horizon · stop</text></g>
    <g transform="translate(310 150)"><rect width="210" height="120" fill="#E8ECEB" stroke="#ADBAB9"/><text x="24" y="50" font-size="24" font-weight="650">Rollout process</text><text x="24" y="82" font-size="16" fill="#3B494C">main-thread simulator</text></g>
    <g transform="translate(576 150)"><rect width="190" height="120" fill="#E8ECEB" stroke="#ADBAB9"/><text x="24" y="50" font-size="24" font-weight="650">MuJoCo</text><text x="24" y="82" font-size="16" fill="#3B494C">image · joint state</text></g>
    <g transform="translate(822 150)"><rect width="210" height="120" fill="#DFE9FF" stroke="#2563EB"/><text x="24" y="50" font-size="24" font-weight="650">ACT policy</text><text x="24" y="82" font-size="16" fill="#3B494C">100-action chunk</text></g>
    <g transform="translate(438 350)"><rect width="300" height="100" fill="#E0E6E5" stroke="#ADBAB9"/><text x="24" y="43" font-size="22" font-weight="650">Rerun timeline</text><text x="24" y="72" font-size="16" fill="#3B494C">frames · stages · actions · timing</text></g>
  </g>
  <g stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M254 210 H300"/><path d="M520 210 H566"/><path d="M766 190 H812"/><path d="M822 238 H776"/><path d="M660 275 V340"/></g>
  <text x="775" y="177" fill="#718083" font-family="ui-monospace, monospace" font-size="14">observation</text>
  <text x="775" y="260" fill="#718083" font-family="ui-monospace, monospace" font-size="14">joint targets</text>
</svg>
