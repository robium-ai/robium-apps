schema_version: "1"
id: quadruped-locomotion
name: Quadruped locomotion (Go2 + Isaac Lab RL)
summary: Train a Unitree Go2 walking policy in Isaac Lab, compare real checkpoints, and optionally pilot it in a private browser session.
version: 1.1.0
status: experimental
license: MIT
tags: [reinforcement-learning, isaac-lab, isaac-sim, go2, gpu-cloud]

runtime:
  kind: remote-gpu         # compatible Linux NVIDIA host; local development stays lightweight
  entrypoint: make smoke

verbs:
  build: make sync
  smoke: make smoke        # GPU-host side; must not fake-pass off-GPU
  check: make check
  test: make test          # local pure-Python config guards only
  doctor: make doctor      # GPU host: verify Isaac Lab launcher and NVIDIA runtime

modes:
  list-envs:
    command: make list-envs
    summary: pod-side, confirm the Go2 task id exists before trusting config
  train:
    command: make train
    summary: SMOKE-profile training by hand (mechanics, not a walking policy)
  train-full:
    command: make train-full
    summary: full training using the installed task defaults or GO2_* overrides
  play:
    command: make play
    summary: roll out the latest checkpoint and capture a walking-Go2 MP4

requirements:
  hardware: []
  gpu: remote              # NVIDIA required; no macOS path for Isaac Lab
  network: required        # remote access and dependency pulls when the host needs them

demo:
  default_mode: play
  hosted: false            # recorded explorer is ready; paid live capacity is not enabled
  recorded_id: quadruped-locomotion
  estimated_startup_seconds: 300

artifacts:
  thumbnail: evidence/previews/go2-hero.png
  case_study: docs/case-study.md
