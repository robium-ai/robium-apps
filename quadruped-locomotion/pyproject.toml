[project]
name = "go2-locomotion"
version = "0.1.0"
description = "Unitree Go2 quadruped locomotion via Isaac Lab reinforcement learning"
readme = "README.md"
authors = [{ name = "robium", email = "admin@robium.ai" }]
# The local wrapper and tests are pure Python. The selected GPU environment owns
# its Isaac Sim and Isaac Lab installation, so this package does not duplicate it.
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# Keep the real Isaac Lab smoke opt-in on a compatible GPU host.
markers = [
    "gpu: needs a GPU pod with Isaac Lab; deselected by default, run via `make smoke`",
]
addopts = "-m 'not gpu'"
